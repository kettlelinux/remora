name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e 'backend[dev]'
      - name: Test
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: frontend
        run: npx --yes pnpm@10 install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: npx --yes pnpm@10 run typecheck
      - name: Build
        working-directory: frontend
        run: npx --yes pnpm@10 run build

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in packaging/remora-start packaging/steamos/*.sh packaging/arch/PKGBUILD; do
            bash -n "$f"
          done
      - name: shellcheck
        run: shellcheck -S warning packaging/remora-start packaging/steamos/*.sh
