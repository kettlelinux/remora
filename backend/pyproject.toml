[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remora-loader"
version = "0.1.0"
description = "A plugin loader for Steam's Game Mode UI that runs Decky Loader plugins unchanged"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "certifi",
    # not used by Remora itself: Decky plugins import them from the loader's environment
    "watchdog>=3",
    "async-timeout>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# store index signatures (ed25519); without it, signed versions show as unchecked
signing = ["cryptography>=41"]

[project.scripts]
remora = "remora.cli:main"

[tool.setuptools.packages.find]
include = ["remora*"]

[tool.setuptools.package-data]
remora = ["compat/*.py", "static/**/*", "locales/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
